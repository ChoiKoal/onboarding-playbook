<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Playbook — 로그인</title>
<style>
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f6f8fb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:36px 32px;width:320px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  h1{font-size:18px;color:#1a5c9e;margin:0 0 4px}
  p{font-size:13px;color:#667;margin:0 0 20px}
  input{width:100%;box-sizing:border-box;padding:10px 12px;margin:6px 0;border:1px solid #d8dee6;border-radius:8px;font-size:14px}
  button{width:100%;padding:11px;margin-top:12px;background:#1a5c9e;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
  button:hover{background:#154b82}
  .err{color:#c0392b;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>병원 온보딩 플레이북</h1>
  <p>열람하려면 로그인하세요.</p>
  <input id="u" placeholder="ID" autocomplete="username">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="go()">열람</button>
  <div class="err" id="err">ID 또는 비밀번호가 올바르지 않습니다.</div>
</div>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function go(){
  try{
    const r = await fetch('payload.json?v=' + Date.now(), {cache:'no-store'}); const {s,i,d} = await r.json();
    const cred = document.getElementById('u').value.trim() + ':' + document.getElementById('p').value;
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(cred), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(s), iterations:300000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(i)}, key, b64(d));
    document.open(); document.write(new TextDecoder().decode(plain)); document.close();
  }catch(e){ document.getElementById('err').style.display='block'; }
}
document.getElementById('p').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
</script>
</body>
</html>
